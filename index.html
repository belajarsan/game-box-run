<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Box Run - Semangat Kemerdekaan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Tema background merah putih kemerdekaan */
            background: linear-gradient(135deg, #8b0000 0%, #111111 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Pesan Semangat Persatuan di Atas Game */
        #theme-header {
            text-align: center;
            margin-bottom: 15px;
            max-width: 600px;
            padding: 0 10px;
        }
        #theme-header h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #theme-header p {
            margin: 0;
            font-size: 12px;
            color: #dddddd;
            font-style: italic;
        }

        /* Kotak Arena Game */
        #game {
            width: 600px;
            height: 200px;
            border-bottom: 4px solid #ffffff;
            position: relative;
            background: linear-gradient(to bottom, #1a1a1a, #2c2c2c);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            border-radius: 4px;
        }
        #dino {
            width: 30px;
            height: 50px;
            background-color: #ff3333; /* Kotak pemain warna merah */
            position: absolute;
            bottom: 0;
            left: 50px;
            border-radius: 4px;
        }
        #cactus {
            width: 20px;
            height: 40px;
            background-color: #ffffff; /* Rintangan warna putih */
            position: absolute;
            bottom: 0;
            left: 580px;
            border-radius: 3px;
        }
        .animate-cactus {
            animation: moveCactus 1.4s infinite linear;
        }
        @keyframes moveCactus {
            0% { left: 600px; }
            100% { left: -20px; }
        }
        .jump {
            animation: jumpDino 0.4s linear;
        }
        @keyframes jumpDino {
            0% { bottom: 0; }
            50% { bottom: 80px; }
            100% { bottom: 0; }
        }
        #score {
            position: absolute;
            top: 10px;
            right: 20px;
            font-weight: bold;
            color: #ffffff;
        }
        #game-over-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-weight: bold;
            color: #ff4d4d;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- Tema Semangat Persatuan Kemerdekaan -->
    <div id="theme-header">
        <h2>MERDEKA! SEMANGAT PERSATUAN BANGSA</h2>
        <p>"Mari jaga persatuan dan rawat kemerdekaan melalui karya dan semangat juang!"</p>
    </div>

    <div id="game">
        <div id="dino"></div>
        <div id="cactus" class="animate-cactus"></div>
        <div id="score">Score: 0</div>
        <div id="game-over-text">
            GAME OVER<br>
            <span style="font-size: 12px; font-weight: normal; color: #fff;">Tap atau Tekan Spasi untuk Ulang</span>
        </div>
    </div>

    <script>
        const dino = document.getElementById("dino");
        const cactus = document.getElementById("cactus");
        const scoreElement = document.getElementById("score");
        const gameOverText = document.getElementById("game-over-text");
        
        let isGameOver = false;
        let scoreInterval;
        let score = 0;

        function jump() {
            if (isGameOver) {
                resetGame();
                return;
            }
            if (!dino.classList.contains("jump")) {
                dino.classList.add("jump");
                setTimeout(function () {
                    dino.classList.remove("jump");
                }, 400);
            }
        }

        function startScore() {
            score = 0;
            scoreInterval = setInterval(() => {
                if (!isGameOver) {
                    score++;
                    scoreElement.innerText = "Score: " + score;
                }
            }, 200);
        }

        function resetGame() {
            isGameOver = false;
            gameOverText.style.display = "none";
            cactus.classList.add("animate-cactus");
            startScore();
        }

        // Deteksi Tabrakan
        function checkCollision() {
            let dinoBottom = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
            let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));

            if (cactusLeft > 40 && cactusLeft < 70 && dinoBottom <= 40) {
                isGameOver = true;
                clearInterval(scoreInterval);
                cactus.classList.remove("animate-cactus");
                gameOverText.style.display = "block";
            }
        }

        setInterval(checkCollision, 10);
        startScore();

        // Kontrol Keyboard (Spasi)
        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault();
                jump();
            }
        });

        // Kontrol Sentuh untuk HP
        document.addEventListener("touchstart", function() {
            jump();
        });

        document.addEventListener("click", function() {
            jump();
        });
    </script>
</body>
</html>
